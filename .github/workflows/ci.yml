name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning -e SC1090,SC2034,SC2211 scripts/*.sh tools/release.sh
      - name: Python
        run: python3 -m py_compile scripts/kit-sub.py tools/test/subscription_names_test.py
      - name: Subscription naming regression tests
        run: python3 tools/test/subscription_names_test.py
      - name: CUSTOM installation and update verification
        run: python3 tools/test/custom_install_test.py
      - name: Release preparation
        run: bash tools/test/release_test.sh
      - name: Генераторы
        run: node --test tools/test/*.test.js
      - name: Проверка копии для --restore (GNU grep и bash)
        run: |
          python3 tools/test/restore_env_test.py
          python3 tools/test/restore_archive_test.py
      - name: Версия в скриптах совпадает с VERSION
        run: |
          v=$(cat VERSION)
          grep -q "^KIT_VERSION=\"$v\"" scripts/3x-ui.sh
          grep -q "^KIT_VERSION=\"$v\"" scripts/hysteria2.sh
          grep -q "^KIT_VERSION=\"$v\"" scripts/kit.sh
      - name: Подпись релиза совпадает с файлами
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          bash tools/release.sh verify

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          trap 'rm -f -- "$notes"' EXIT
          bash tools/release.sh notes > "$notes"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "3X-UI KIT CUSTOM $GITHUB_REF_NAME" --notes-file "$notes"
